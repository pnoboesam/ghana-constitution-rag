name: Evaluate RAG

on:
  pull_request:
  push:
    branches: [main]

jobs:
  evaluate:

    runs-on: unbuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python evaluation/evaluate.py

